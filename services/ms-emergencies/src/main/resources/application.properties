spring.application.name=ms-emergencies
server.port=${EMERGENCIES_PORT:8083}
spring.datasource.url=${EMERGENCIES_DB_URL:jdbc:mysql://localhost:3306/instalert_emergencies}
spring.datasource.username=${EMERGENCIES_DB_USER}
spring.datasource.password=${EMERGENCIES_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.jackson.deserialization.fail-on-unknown-properties=true
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
app.cors.origins=${EMERGENCIES_CORS_ORIGINS:http://localhost:4200}
server.error.include-message=never

notifications.internal-key=${NOTIFICATIONS_INTERNAL_KEY:}
notifications.communities-url=${COMMUNITIES_SERVICE_URL:http://localhost:8082}
notifications.worker.enabled=${NOTIFICATIONS_WORKER_ENABLED:true}
