spring.application.name=ms-account
server.port=${ACCOUNT_PORT:8081}
spring.datasource.url=${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/instalert_account}
spring.datasource.username=${ACCOUNT_DB_USER}
spring.datasource.password=${ACCOUNT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
account.jwt.secret=${ACCOUNT_JWT_SECRET}
account.jwt.ttl-seconds=${ACCOUNT_JWT_TTL_SECONDS:3600}
account.cors.origins=${ACCOUNT_CORS_ORIGINS:http://localhost:4200}
server.error.include-message=never
