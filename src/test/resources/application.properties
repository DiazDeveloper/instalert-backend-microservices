spring.datasource.url=jdbc:h2:mem:monolith;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.instalert_backend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
account.service.url=http://127.0.0.1:1
app.cors.origins=http://localhost:4200
