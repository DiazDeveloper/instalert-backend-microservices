spring.application.name=instalert-monolith
spring.datasource.url=${MONOLITH_DB_URL:jdbc:mysql://localhost:3306/instalert_db}
spring.datasource.username=${MONOLITH_DB_USER}
spring.datasource.password=${MONOLITH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.instalert_backend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
server.port=${PORT:8082}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
app.cors.origins=${MONOLITH_CORS_ORIGINS:http://localhost:4200}
server.error.include-message=never

# Additive local Communities schema, never resets existing tables.
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:community-notifications.sql
notifications.internal-key=${NOTIFICATIONS_INTERNAL_KEY:}
